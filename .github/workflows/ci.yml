name: CI

on:
  push:
    branches:
      - src
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - src
    paths-ignore:
      - "docs/**"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Build
        run: npm run build
